[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sd-rlcd"
version = "0.1.0"
description = "Style-Decoupled RLCD + Style-CalibBench scaffolding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
data = ["datasets>=2.18", "huggingface_hub>=0.22"]
train = ["torch>=2.2", "transformers>=4.40", "peft>=0.11", "accelerate>=0.30"]

[project.scripts]
sd-rlcd = "sd_rlcd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
